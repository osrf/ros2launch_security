---
nodl_version: 2
description: Sink node that subscribes to the fake IMU messages and can reset the IMU.
subscriptions:
  - name: imu
    type: sensor_msgs/msg/Imu
    qos:
      history: KEEP_LAST
      depth: 10
      reliability: RELIABLE
      durability: VOLATILE
service_clients:
  - name: reset_imu
    type: example_interfaces/srv/Trigger
